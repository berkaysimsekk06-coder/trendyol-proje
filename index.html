<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trendyol Proje - Ana Sayfa</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f8f8f8; }
        header { background-color: #fff; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .logo { font-size: 24px; font-weight: bold; color: #f27a1a; text-decoration: none; }
        .search-bar { display: flex; width: 40%; }
        .search-bar input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px 0 0 4px; outline: none; }
        .search-bar button { background-color: #f27a1a; color: white; border: none; padding: 0 20px; border-radius: 0 4px 4px 0; cursor: pointer; }
        .nav-links a { margin-left: 20px; text-decoration: none; color: #333; font-weight: bold; }
        .nav-links a:hover { color: #f27a1a; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        h2 { color: #333; margin-bottom: 20px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .product-card { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .product-card img { width: 100%; height: 200px; object-fit: cover; border-radius: 4px; margin-bottom: 10px; }
        .product-title { font-size: 16px; font-weight: bold; color: #333; margin-bottom: 10px; }
        .product-price { color: #f27a1a; font-size: 18px; font-weight: bold; margin-bottom: 15px; }
        .btn-cart { background-color: #f27a1a; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn-cart:hover { background-color: #e06c12; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">trendyol</a>
        <div class="search-bar">
            <input type="text" placeholder="Aradığınız ürün, kategori veya marka yazın...">
            <button onclick="alert('Arama yapıldı!')">Ara</button>
        </div>
        <div class="nav-links">
            <a href="login.html">Giriş Yap</a>
            <a href="#" onclick="alert('Sepetiniz görüntüleniyor!')">Sepetim</a>
        </div>
    </header>

    <div class="container">
        <h2>Öne Çıkan Ürünler</h2>
        <div class="product-grid">
            <!-- Ürün 1 -->
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500" alt="Tişört">
                <div class="product-title">Erkek Oversize Tişört</div>
                <div class="product-price">249,99 TL</div>
                <button class="btn-cart" onclick="alert('Ürün başarıyla sepete eklendi!')">Sepete Ekle</button>
            </div>
            <!-- Ürün 2 -->
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" alt="Ayakkabı">
                <div class="product-title">Koşu ve Spor Ayakkabısı</div>
                <div class="product-price">1.299,99 TL</div>
                <button class="btn-cart" onclick="alert('Ürün başarıyla sepete eklendi!')">Sepete Ekle</button>
            </div>
            <!-- Ürün 3 -->
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" alt="Kulaklık">
                <div class="product-title">Kablosuz Kulaklık</div>
                <div class="product-price">899,99 TL</div>
                <button class="btn-cart" onclick="alert('Ürün başarıyla sepete eklendi!')">Sepete Ekle</button>
            </div>
            <!-- Ürün 4 -->
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" alt="Saat">
                <div class="product-title">Minimalist Kol Saati</div>
                <div class="product-price">549,99 TL</div>
                <button class="btn-cart" onclick="alert('Ürün başarıyla sepete eklendi!')">Sepete Ekle</button>
            </div>
        </div>
    </div>

</body>
</html>
