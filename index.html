<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trendyol - En Trend Ürünler</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f4f4; color: #333; }
        header { background-color: #ff9900; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 24px; font-weight: bold; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 5px; margin-bottom: 10px; }
        .card h3 { font-size: 16px; margin-bottom: 10px; color: #444; }
        .card .price { color: #ff9900; font-weight: bold; font-size: 18px; margin-bottom: 15px; }
        .card button { background-color: #ff9900; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        .card button:hover { background-color: #e68a00; }
        footer { text-align: center; padding: 20px; margin-top: 40px; background-color: #222; color: white; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <h1>trendyol</h1>
        <p>İhtiyacın Olan Her Şey Kapında</p>
    </header>

    <div class="container">
        <h2 style="margin-bottom: 20px;">Popüler Ürünler</h2>
        <div class="products">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30" alt="Saat">
                <h3>Akıllı Saat Pro</h3>
                <div class="price">1.299 TL</div>
                <button>Sepete Ekle</button>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e" alt="Kulaklık">
                <h3>Kablosuz Kulaklık</h3>
                <div class="price">799 TL</div>
                <button>Sepete Ekle</button>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff" alt="Ayakkabı">
                <h3>Spor Koşu Ayakkabısı</h3>
                <div class="price">999 TL</div>
                <button>Sepete Ekle</button>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1491553895911-0055eca6402d" alt="Spor Ayakkabı">
                <h3>Günlük Sneaker</h3>
                <div class="price">849 TL</div>
                <button>Sepete Ekle</button>
            </div>
        </div>
    </div>

    <footer>
        <p>Yapımcı: Berkay Şimşek</p>[cite: 1]
        <p>© 2026 Tüm Hakları Saklıdır.</p>
    </footer>

</body>
</html>
