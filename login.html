<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Giriş Yap - Trendyol</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f8f8f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        .login-box h2 { color: #f27a1a; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 14px; margin-bottom: 5px; color: #333; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btn { width: 100%; padding: 10px; background-color: #f27a1a; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        .btn:hover { background-color: #e06c12; }
        .back-link { display: block; margin-top: 15px; color: #666; text-decoration: none; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Trendyol Giriş Yap</h2>
        <form>
            <div class="input-group">
                <label>E-posta Adresi</label>
                <input type="email" placeholder="ornek@email.com" required>
            </div>
            <div class="input-group">
                <label>Şifre</label>
                <input type="password" placeholder="******" required>
            </div>
            <button type="submit" class="btn">Giriş Yap</button>
        </form>
        <a href="index.html" class="back-link">← Ana Sayfaya Dön</a>
    </div>
</body>
</html>
